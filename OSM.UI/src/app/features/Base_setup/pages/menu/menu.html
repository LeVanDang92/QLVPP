<app-setup-page-layout breadcrumb="{{ breadcrumb() }}" title="{{ title() }}" sectionTitle="{{ sectionTitle() }}"
  [createDisabled]="!!selectedMenu()" [updateDisabled]="!selectedMenu()" [deleteDisabled]="!selectedMenu()"
  [resetDisabled]="false" (create)="onCreate()" (update)="onUpdate()" (delete)="onDelete()" (reset)="onReset()">

  <div class="menu-page">
    <section class="grid-section">
      <app-ag-grid title="Menu List" [showSearch]="true" [rowData]="rowData()" [columnDefs]="colDefs"
        [defaultColDef]="defaultColDef" [gridOptions]="gridOptions" rowSelection="single"
        (rowClicked)="onRowClicked($event)">
      </app-ag-grid>
    </section>

    <section class="detail-card compact-detail">
      <div class="card-header compact-header">
        <div>
         <h3>{{ 'MENU.DETAIL' | translate }}</h3>
          <p>{{ 'MENU.SECTION_TITLE' | translate }}</p>
        </div>

        @if (selectedMenu()) {
        <span class="mode-badge edit">Edit</span>
        } @else {
        <span class="mode-badge create">Create</span>
        }
      </div>

      <form [formGroup]="form" class="menu-form compact-form">
        <div class="form-grid compact-grid">
          <div class="form-field">
            <label for="menuId">Menu ID <span>*</span></label>
            <input id="menuId" type="text" formControlName="menuId" placeholder="menuSetup" />
          </div>

          <div class="form-field">
            <label for="menuName">Menu Name <span>*</span></label>
            <input id="menuName" type="text" formControlName="menuName" placeholder="Menu Setup" />
          </div>

          <div class="form-field">
            <label for="menuShortName">Short Name <span>*</span></label>
            <input id="menuShortName" type="text" formControlName="menuShortName" placeholder="Menu" />
          </div>

          <div class="form-field">
            <label for="displayOrder">Order</label>
            <input id="displayOrder" type="number" min="0" formControlName="displayOrder" placeholder="0" />
          </div>

          <div class="form-field">
            <label for="menuType">Menu Type <span>*</span></label>
            <select id="menuType" formControlName="menuType">
              <option value="">Select...</option>
              @for (type of menuTypes(); track type.data_Code) {
              <option [value]="type.data_Code">
                {{ type.data_Code }} :: {{ type.data_Value }}
              </option>
              }
            </select>
          </div>

          <div class="form-field">
            <label for="menuGroup">Menu Group <span>*</span></label>
            <select id="menuGroup" formControlName="menuGroup">
              <option value="">Select...</option>
              @for (group of menuGroups(); track group.data_Code) {
              <option [value]="group.data_Code">
                {{ group.data_Code }} :: {{ group.data_Value }}
              </option>
              }
            </select>
          </div>

          <div class="form-field">
            <label for="parentMenuId">Parent Menu</label>
            <input id="parentMenuId" type="text" formControlName="parentMenuId" placeholder="settings" />
          </div>

          <div class="form-field">
            <label for="iconClass">Icon</label>
            <input id="iconClass" type="text" formControlName="iconClass" placeholder="ti ti-settings" />
          </div>

          <div class="form-field wide">
            <label for="menuUrl">Menu URL</label>
            <input id="menuUrl" type="text" formControlName="menuUrl" placeholder="/menu" />
          </div>

          <div class="form-field wide">
            <label for="externalUrl">External URL</label>
            <input id="externalUrl" type="text" formControlName="externalUrl" placeholder="https://..." />
          </div>

          <div class="form-field">
            <label for="badgeText">Badge Text</label>
            <input id="badgeText" type="text" formControlName="badgeText" placeholder="New" />
          </div>

          <div class="form-field">
            <label for="badgeClass">Badge Class</label>
            <input id="badgeClass" type="text" formControlName="badgeClass" placeholder="badge bg-primary" />
          </div>
        </div>

        <div class="compact-toggle-row">
          <label class="mini-switch">
            <input type="checkbox" formControlName="isActive" />
            <span></span>
            <strong>Active</strong>
          </label>

          <label class="mini-switch">
            <input type="checkbox" formControlName="closable" />
            <span></span>
            <strong>Closable</strong>
          </label>
        </div>
      </form>
    </section>
  </div>

</app-setup-page-layout>
