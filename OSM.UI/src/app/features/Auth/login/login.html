<div class="login-page">
  <div class="login-shell">
    <section class="login-brand-panel">
      <div class="brand-content">
        <div class="brand-logo">
          <img src="assets/img/logo.svg" alt="OSM Logo" />
        </div>

        <h1>Welcome OSM</h1>
        <p>
          Sign in to manage operation setup, menus, roles, permissions and system configuration.
        </p>
      </div>

      <div class="brand-footer">
        <span>OSM System</span>
        <strong>2026</strong>
      </div>
    </section>

    <section class="login-card">
      <div class="mobile-logo">
        <img src="assets/img/logo.svg" alt="OSM Logo" />
      </div>

      <div class="login-header">
        <h2>Sign In</h2>
        <p>Please enter your account details.</p>
      </div>

      @if (errorMessage()) {
        <div class="login-alert">
          <i class="ti ti-alert-circle"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <div class="form-group">
        <label for="userName">Username</label>

        <div class="input-control">
          <i class="ti ti-user"></i>
          <input
            id="userName"
            type="text"
            autocomplete="username"
            placeholder="Enter username or email"
            [value]="userName()"
            [disabled]="isLoading()"
            (input)="userName.set($any($event.target).value)"
            (keyup.enter)="login()"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="input-control">
          <i class="ti ti-lock"></i>

          <input
            id="password"
            [type]="isPasswordVisible() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Enter password"
            [value]="password()"
            [disabled]="isLoading()"
            (input)="password.set($any($event.target).value)"
            (keyup.enter)="login()"
          />

          <button
            type="button"
            class="password-toggle"
            tabindex="-1"
            [disabled]="isLoading()"
            (click)="togglePassword()"
          >
            <i class="ti" [class.ti-eye]="!isPasswordVisible()" [class.ti-eye-off]="isPasswordVisible()"></i>
          </button>
        </div>
      </div>

      <button
        type="button"
        class="login-button"
        [disabled]="isLoading()"
        (click)="login()"
      >
        @if (isLoading()) {
          <span class="spinner"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
          <i class="ti ti-arrow-right"></i>
        }
      </button>

      <p class="copyright">
        Copyright © 2026 - OSM
      </p>
    </section>
  </div>
</div>
